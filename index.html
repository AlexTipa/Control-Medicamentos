<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de Medicamentos</title>
  <style>
    /* Estilos base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #121212; /* Fondo oscuro */
      color: #e0e0e0; /* Texto claro */
      line-height: 1.6;
    }

    header {
      background-color: #1e88e5; /* Azul vibrante */
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: bold;
    }

    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      gap: 20px;
      margin-top: 10px;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    nav a:hover {
      background-color: #1565c0; /* Azul más oscuro */
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
      background-color: #1e1e1e; /* Fondo gris oscuro */
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    #formularioMedicamento h2 {
      text-align: center;
      color: #1e88e5;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    #formularioMedicamento input[type="text"],
    #formularioMedicamento input[type="date"] {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid #333;
      border-radius: 10px;
      font-size: 1rem;
      background-color: #2c2c2c; /* Fondo de los inputs */
      color: #e0e0e0;
    }

    #formularioMedicamento input:focus {
      border-color: #1e88e5;
      outline: none;
      box-shadow: 0 0 8px rgba(30, 136, 229, 0.5);
    }

    #formularioMedicamento button[type="submit"] {
      background-color: #1e88e5;
      color: white;
      padding: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      width: 100%;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    #formularioMedicamento button[type="submit"]:hover {
      background-color: #1565c0;
      transform: scale(1.05);
    }

    /* Media Queries para diseño responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
      }

      nav a {
        padding: 10px;
        text-align: center;
      }

      #formularioMedicamento h2 {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.5rem;
      }

      nav ul {
        gap: 5px;
      }

      nav a {
        font-size: 0.9rem;
      }

      #formularioMedicamento h2 {
        font-size: 1.5rem;
      }

      #formularioMedicamento button[type="submit"] {
        font-size: 1rem;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>💊 Control de Medicamentos</h1>
      <nav>
        <ul>
          <li><a href="misMedicamentos.html">Mis Medicamentos</a></li>
          <li><a href="historialTomas.html">Historial de Tomas</a></li>
        </ul>
      </nav>
    </header>

    <section id="formularioMedicamento">
      <h2>➕ Agregar Medicamento</h2>
      <form id="formMedicamento" onsubmit="guardarMedicamento(event)">
        <label for="nombreMedicamento">Nombre del medicamento</label>
        <input type="text" id="nombreMedicamento" placeholder="ej: Paracetamol" required autocomplete="off">
    
        <label for="presentacion">Presentación</label>
        <input type="text" id="presentacion" placeholder="ej: Tabletas, Jarabe" required>
    
        <label for="dosis">Dosis</label>
        <input type="text" id="dosis" placeholder="ej: 500 mg, 10 ml" required>
    
        <label for="frecuencia">Frecuencia</label>
        <input type="text" id="frecuencia" placeholder="ej: Cada 8 horas, Una vez al día" required>
    
        <label for="via">Vía de administración</label>
        <input type="text" id="via" placeholder="ej: Oral, Intravenosa (opcional)">
    
        <label for="instrucciones">Instrucciones especiales</label>
        <input type="text" id="instrucciones" placeholder="ej: Tomar con alimentos (opcional)">
    
        <label for="fechaInicio">Fecha de inicio</label>
        <input type="date" id="fechaInicio" placeholder="Fecha de inicio" min="">
    
        <label for="fechaFin">Fecha de fin</label>
        <input type="date" id="fechaFin" placeholder="Fecha de fin" min="">
    
        <button type="submit">Guardar Medicamento</button>
      </form>
    </section>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
