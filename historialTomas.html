<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historial de Tomas</title>
  <style>
    /* Estilos base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #121212; /* Fondo oscuro */
      color: #e0e0e0; /* Texto claro */
      line-height: 1.6;
    }

    header {
      background-color: #1e88e5; /* Azul vibrante */
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: bold;
    }

    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      gap: 20px;
      margin-top: 10px;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    nav a:hover {
      background-color: #1565c0; /* Azul más oscuro */
    }

    #historial {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
      background-color: #1e1e1e; /* Fondo gris oscuro */
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    #historial h2 {
      text-align: center;
      color: #1e88e5;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .card {
      background-color: #2c2c2c; /* Fondo oscuro para las tarjetas */
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .card h3 {
      color: #e0e0e0;
      margin-bottom: 10px;
    }

    .card p {
      color: #b0b0b0;
      margin-bottom: 10px;
    }

    .card button {
      background-color: #1e88e5;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .card button:hover {
      background-color: #1565c0;
      transform: scale(1.05);
    }

    /* Media Queries para diseño responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
      }

      nav a {
        padding: 10px;
        text-align: center;
      }

      #historial h2 {
        font-size: 1.8rem;
      }

      .card {
        padding: 10px;
      }
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.5rem;
      }

      nav ul {
        gap: 5px;
      }

      nav a {
        font-size: 0.9rem;
      }

      #historial h2 {
        font-size: 1.5rem;
      }

      .card button {
        font-size: 0.9rem;
        padding: 8px 10px;
      }
    }
    #historial .borrar-toma {
  background-color: #e53935; /* Rojo */
  color: white;
  padding: 5px 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background-color 0.3s ease;
}

#historial .borrar-toma:hover {
  background-color: #d32f2f; /* Rojo más oscuro */
}
  </style>
</head>
<body>
  <header>
    <h1>📜 Historial de Tomas</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="misMedicamentos.html">Mis Medicamentos</a></li>
        <li><a href="historialTomas.html">Historial de Tomas</a></li>
      </ul>
    </nav>
  </header>

  <section id="historial">
    <h2>📜 Historial de Tomas</h2>
    <div id="listaHistorial">
      <!-- Aquí se generarán las tarjetas dinámicamente -->
    </div>
  </section>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
