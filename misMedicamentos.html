<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Medicamentos</title>
  <style>
    /* Estilos base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #121212; /* Fondo oscuro */
      color: #e0e0e0; /* Texto claro */
      line-height: 1.6;
    }

    header {
      background-color: #1e88e5; /* Azul vibrante */
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: bold;
    }

    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      gap: 20px;
      margin-top: 10px;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    nav a:hover {
      background-color: #1565c0; /* Azul más oscuro */
    }

    #misMedicamentos {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
      background-color: #1e1e1e; /* Fondo gris oscuro */
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    #misMedicamentos h2 {
      text-align: center;
      color: #1e88e5;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .card {
      background-color: #2c2c2c; /* Fondo oscuro para las tarjetas */
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .card h3 {
      color: #e0e0e0;
      margin-bottom: 10px;
    }

    .card p {
      color: #b0b0b0;
      margin-bottom: 10px;
    }

    .card button {
      background-color: #1e88e5;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .card button:hover {
      background-color: #1565c0;
      transform: scale(1.05);
    }

    /* Media Queries para diseño responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
      }

      nav a {
        padding: 10px;
        text-align: center;
      }

      #misMedicamentos h2 {
        font-size: 1.8rem;
      }

      .card {
        padding: 10px;
      }
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.5rem;
      }

      nav ul {
        gap: 5px;
      }

      nav a {
        font-size: 0.9rem;
      }

      #misMedicamentos h2 {
        font-size: 1.5rem;
      }

      .card button {
        font-size: 0.9rem;
        padding: 8px 10px;
      }
    }
    .card .botones {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

.card .botones button {
  color: white;
  padding: 10px 15px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background-color 0.3s ease, transform 0.2s ease;
}

.card .botones button:hover {
  transform: scale(1.05);
}

/* Botón Editar (Amarillo) */
.card .botones .editar {
  background-color: #fbc02d; /* Amarillo */
}

.card .botones .editar:hover {
  background-color: #f9a825; /* Amarillo más oscuro */
}

/* Botón Borrar (Rojo) */
.card .botones .borrar {
  background-color: #e53935; /* Rojo */
}

.card .botones .borrar:hover {
  background-color: #d32f2f; /* Rojo más oscuro */
}

/* Botón Marcar como Tomado (Verde) */
.card .botones .marcar {
  background-color: #43a047; /* Verde */
}

.card .botones .marcar:hover {
  background-color: #388e3c; /* Verde más oscuro */
}
  </style>
</head>
<body>
  <header>
    <h1>📋 Mis Medicamentos</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="misMedicamentos.html">Mis Medicamentos</a></li>
        <li><a href="historialTomas.html">Historial de Tomas</a></li>
      </ul>
    </nav>
  </header>

  <section id="misMedicamentos">
    <h2>📋 Mis Medicamentos</h2>
    <div id="listaMedicamentos">
      <!-- Aquí se generarán las tarjetas dinámicamente -->
    </div>
  </section>
  <section id="editarMedicamento" style="display: none; margin: 30px auto; padding: 20px; background-color: #1e1e1e; border-radius: 15px; box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3); max-width: 800px;">
    <h2 style="text-align: center; color: #1e88e5; margin-bottom: 20px;">✏️ Editar Medicamento</h2>
    <form id="formEditarMedicamento" onsubmit="guardarCambios(event)" style="display: flex; flex-direction: column; gap: 15px;">
      <input type="hidden" id="editarId">
  
      <label for="editarNombreMedicamento">Nombre del medicamento</label>
      <input type="text" id="editarNombreMedicamento" placeholder="ej: Paracetamol" required style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background-color: #2c2c2c; color: #e0e0e0;">
  
      <label for="editarPresentacion">Presentación</label>
      <input type="text" id="editarPresentacion" placeholder="ej: Tabletas, Jarabe" required style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background-color: #2c2c2c; color: #e0e0e0;">
  
      <label for="editarDosis">Dosis</label>
      <input type="text" id="editarDosis" placeholder="ej: 500 mg, 10 ml" required style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background-color: #2c2c2c; color: #e0e0e0;">
  
      <label for="editarFrecuencia">Frecuencia</label>
      <input type="text" id="editarFrecuencia" placeholder="ej: Cada 8 horas, Una vez al día" required style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background-color: #2c2c2c; color: #e0e0e0;">
  
      <label for="editarVia">Vía de administración</label>
      <input type="text" id="editarVia" placeholder="ej: Oral, Intravenosa (opcional)" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background-color: #2c2c2c; color: #e0e0e0;">
  
      <label for="editarInstrucciones">Instrucciones especiales</label>
      <input type="text" id="editarInstrucciones" placeholder="ej: Tomar con alimentos (opcional)" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background-color: #2c2c2c; color: #e0e0e0;">
  
      <label for="editarFechaInicio">Fecha de inicio</label>
      <input type="date" id="editarFechaInicio" placeholder="Fecha de inicio" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background-color: #2c2c2c; color: #e0e0e0;">
  
      <label for="editarFechaFin">Fecha de fin</label>
      <input type="date" id="editarFechaFin" placeholder="Fecha de fin" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background-color: #2c2c2c; color: #e0e0e0;">
  
      <div style="display: flex; justify-content: space-between; gap: 10px;">
        <button type="submit" style="background-color: #1e88e5; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: background-color 0.3s ease;">Guardar Cambios</button>
        <button type="button" onclick="cancelarEdicion()" style="background-color: #e53935; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: background-color 0.3s ease;">Cancelar</button>
      </div>
    </form>
  </section>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
